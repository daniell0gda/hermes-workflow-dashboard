{% extends "base.html" %}
{% block title %}Run not found{% endblock %}

{% block content %}
<header class="page-head">
  <p class="eyebrow">Feature check</p>
  <h1>Run not found</h1>
  <p class="lede">
    No run is stored under <code>{{ run_id }}</code>. It may not have been published yet,
    or it may have been deleted.
  </p>
  <p><a class="button" href="{{ url_path('/') }}">Back to all runs</a></p>
</header>
{% endblock %}
